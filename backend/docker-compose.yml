services:

  # =====================================
  # DATABASE
  # =====================================
  postgres:
    image: postgres:16
    container_name: makermint_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: makermint

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - makermint_net


  # =====================================
  # REDIS
  # =====================================
  redis:
    image: redis:7
    container_name: makermint_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - makermint_net


  # =====================================
  # BACKEND
  # =====================================
  backend:
    build:
      context: .

    container_name: makermint_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      PYTHONPATH: /app

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app

    command: >
      sh -c "
      echo 'Starting backend...' &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

    networks:
      - makermint_net


# =====================================
# VOLUMES
# =====================================
volumes:
  pgdata:


# =====================================
# NETWORK
# =====================================
networks:
  makermint_net:
    driver: bridge