services:

  # =====================================
  # DATABASE
  # =====================================
  postgres:
    image: postgres:16
    container_name: kairova_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kairova

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - kairova_net


  # =====================================
  # REDIS
  # =====================================
  redis:
    image: redis:7
    container_name: kairova_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - kairova_net


  # =====================================
  # BACKEND (DEV MODE)
  # =====================================
  backend:
    build: .

    container_name: kairova_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres:5432/kairova
      REDIS_URL: redis://redis:6379/0

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - .:/app

    command: >
      sh -c "
      echo 'Waiting for postgres...' &&
      while ! nc -z postgres 5432; do sleep 1; done &&
      echo 'Postgres is ready' &&
      uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "

    networks:
      - kairova_net


# =====================================
# VOLUMES
# =====================================
volumes:
  pgdata:


# =====================================
# NETWORK
# =====================================
networks:
  kairova_net:
    driver: bridge